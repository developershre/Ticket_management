[package]
name = "management"
version = "0.1.0"
authors = ["developershre <developershre0901@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = ["router"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["time", "rt"] }
# Centralized HTTP client for the Google Sheets TMS API. `reqwest` (json,
# rustls) and the futures channels are already in the dependency tree via
# dioxus fullstack — these declarations add no new compiled crates.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
futures-channel = "0.3"
futures-util = "0.3"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server"]
