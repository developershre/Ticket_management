[package]
name = "management"
version = "1.2.1"
authors = ["developershre <developershre0901@gmail.com>"]
description = "BPSL IT Support Ticket and Task Management"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = ["router"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["time", "rt", "sync"] }
# Centralized HTTP client for the Google Sheets TMS API. `reqwest` (json,
# rustls) and the futures channels are already in the dependency tree via
# dioxus fullstack — these declarations add no new compiled crates.
reqwest = { version = "0.12", features = ["json"] }
futures-channel = "0.3"
futures-util = "0.3"
notify-rust = "4.19.0"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server"]

[package.metadata.deb]
name = "bpsl-it-support"
maintainer = "developershre <developershre0901@gmail.com>"
copyright = "Copyright © 2026 Bhagwati Power and Steel Limited"
depends = "$auto, libc6 (>= 2.31), libgtk-3-0 (>= 3.24) | libgtk-3-0t64, libwebkit2gtk-4.1-0 (>= 2.36) | libwebkit2gtk-4.0-37, libssl3 | libssl1.1"
recommends = "libayatana-appindicator3-1 | libappindicator3-1"
section = "utils"
priority = "optional"
extended-description = """\
BPSL IT Support Ticket and Task Management desktop application with real-time Google Sheets synchronization."""

[package.metadata.generate-rpm]
name = "bpsl-it-support"
summary = "BPSL IT Support Ticket and Task Management"
license = "Proprietary"
vendor = "Bhagwati Power and Steel Limited"
url = "https://github.com/developershre/Ticket_management"

# ============================================================
# Development Profiles (disable incremental hard-link warning on Windows)
# ============================================================
[profile.dev]
incremental = false

[profile.test]
incremental = false

# ============================================================
# Production Release Optimization Profiles
# ============================================================
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.desktop-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true


